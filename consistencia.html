function abrirFolha(titulo, sub, corpo, aoAbrir){
  const f = document.getElementById('folha');
  document.getElementById('folha-corpo').innerHTML =
    `<h3>${esc(titulo)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}${corpo}`;
  document.getElementById('veu').classList.add('aberto');
  f.classList.add('aberta');
  f.scrollTop = 0;
  f.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', fecharFolha));
  if(aoAbrir) aoAbrir();
}
function fecharFolha(){
  document.getElementById('folha').classList.remove('aberta');
  document.getElementById('veu').classList.remove('aberto');
}
document.getElementById('veu').addEventListener('click', fecharFolha);
document.addEventListener('keydown', e => { if(e.key === 'Escape') fecharFolha(); });

/* --- Registro de sono --- */
function abrirSono(data){
  const c = ciclo();
  const h = c.habitos.find(x => x.tipo === 'sono');
  const atual = registro(data).habitos[h.id] || {};
  const meta = metaSono(data, c);
  abrirFolha('Sono', `${dataLonga(data)}${meta ? ` · meta: na cama até ${meta}` : ''}`, `
    <div class="dupla">
      <label class="campo"><span>Fui para a cama às</span>
        <input type="time" id="sono-deitar" value="${atual.deitar || meta || '00:30'}"></label>
      <label class="campo"><span>Horas dormidas</span>
        <input type="number" id="sono-horas" step="0.25" min="0" max="16" placeholder="opcional" value="${atual.horas || ''}"></label>
    </div>
    <div class="folha-acoes">
      ${atual.deitar ? '<button class="btn perigo" id="sono-limpar">Limpar</button>' : '<button class="btn" data-fechar>Cancelar</button>'}
      <button class="btn volt" id="sono-salvar">Salvar</button>
    </div>`, () => {
    document.getElementById('sono-salvar').addEventListener('click', () => {
      const deitar = document.getElementById('sono-deitar').value;
      if(!deitar){ avisar('Informe o horário.'); return; }
      const horas = Number(document.getElementById('sono-horas').value) || null;
      registro(data).habitos[h.id] = {deitar, horas};
      salvar(); fecharFolha(); vibrar(14);
      const a = avaliarHabito(h, data, c);
      avisar(a.feito >= 1 ? `Meta de sono atingida · +${a.xp} XP` : a.feito > 0 ? `Perto da meta · +${a.xp} XP` : 'Sono registrado.', a.feito > 0);
      RENDERIZADORES[abaAtual]();
    });
    const lim = document.getElementById('sono-limpar');
    if(lim) lim.addEventListener('click', () => {
      delete registro(data).habitos[h.id];
      salvar(); fecharFolha(); RENDERIZADORES[abaAtual]();
    });
  });
}

/* --- Trocar a atividade de um dia (exceção pontual) --- */
function abrirTrocaAtividade(data){
  const c = ciclo();
  const plano = atividadePlanejada(data, c);
  const r = resumoDia(data, c);
  const reg = registro(data);
  abrirFolha(dataLonga(data), 'Vale só para este dia — a agenda da semana continua como está.', `
    <label class="campo"><span>Atividade do dia</span>
      <select id="troca-tipo">
        ${Object.entries(TIPOS_ATIVIDADE).filter(([k]) => k !== 'custom').map(([k,v]) =>
          `<option value="${k}" ${plano.tipo === k ? 'selected' : ''}>${v.emoji} ${v.nome}</option>`).join('')}
        <option value="custom" ${plano.tipo === 'custom' ? 'selected' : ''}>⭐ Personalizada</option>
      </select></label>
    <label class="campo" id="campo-custom" style="${plano.tipo === 'custom' ? '' : 'display:none'}">
      <span>Nome da atividade</span>
      <input type="text" id="troca-nome" value="${esc(plano.tipo === 'custom' ? plano.nome : '')}" placeholder="Ex.: natação"></label>
    ${plano.exige ? `
      <div class="interruptor" style="margin-top:6px">
        <span style="font-weight:600">Marcar como realizada</span>
        <div class="chave ${reg.atividade && reg.atividade.feita ? 'on' : ''}" id="chave-feita" role="switch" tabindex="0"></div>
      </div>` : `<p class="sub" style="margin-top:12px">Recuperação e descanso já contam como cumpridos.</p>`}
    <div class="folha-acoes">
      ${plano.excecao ? '<button class="btn" id="voltar-agenda">Voltar à agenda</button>' : '<button class="btn" data-fechar>Cancelar</button>'}
      <button class="btn volt" id="troca-salvar">Salvar</button>
    </div>
    <p class="sub" style="margin:14px 0 0;text-align:center">Progresso do dia: ${pct(r.percent)}</p>`, () => {
    const sel = document.getElementById('troca-tipo');
    sel.addEventListener('change', () => {
      document.getElementById('campo-custom').style.display = sel.value === 'custom' ? '' : 'none';
    });
    let feita = !!(reg.atividade && reg.atividade.feita);
    const chave = document.getElementById('chave-feita');
    if(chave){
      const alt = () => { feita = !feita; chave.classList.toggle('on', feita); };
      chave.addEventListener('click', alt);
      chave.addEventListener('keydown', e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); alt(); } });
    }
    document.getElementById('troca-salvar').addEventListener('click', () => {
      const tipo = sel.value;
      if(tipo === 'custom'){
        const nome = document.getElementById('troca-nome').value.trim() || 'Atividade';
        c.excecoes[data] = {tipo:'custom', nome, emoji:'⭐', exige:true};
      } else {
        c.excecoes[data] = {tipo};
      }
      const novoPlano = atividadePlanejada(data, c);
      reg.atividade = novoPlano.exige ? {feita, tipo:novoPlano.tipo} : null;
      salvar(); fecharFolha(); avisar('Dia ajustado.', true);
      RENDERIZADORES[abaAtual]();
    });
    const voltar = document.getElementById('voltar-agenda');
    if(voltar) voltar.addEventListener('click', () => {
      delete c.excecoes[data];
      salvar(); fecharFolha(); avisar('Dia voltou para a agenda padrão.');
      RENDERIZADORES[abaAtual]();
    });
  });
}

/* --- Atividade adicional em dia de recuperação --- */
function abrirExtra(data){
  abrirFolha('Atividade adicional', 'Registrada como extra — não muda o plano do dia.', `
    <label class="campo"><span>O que você fez?</span>
      <input type="text" id="extra-nome" placeholder="Ex.: treino leve em casa"></label>
    <div class="folha-acoes">
      <button class="btn" data-fechar>Cancelar</button>
      <button class="btn volt" id="extra-salvar">Registrar</button>
    </div>`, () => {
    const campo = document.getElementById('extra-nome');
    campo.focus();
    document.getElementById('extra-salvar').addEventListener('click', () => {
      const nome = campo.value.trim();
      if(!nome){ avisar('Descreva a atividade.'); return; }
      registro(data).extras.push({nome, emoji:'⭐'});
      salvar(); fecharFolha(); vibrar(12); avisar('Movimento registrado.', true);
      RENDERIZADORES[abaAtual]();
    });
  });
}

/* --- Criar / editar hábito --- */
const EMOJIS = ['🍽️','🍫','💊','💧','🌙','🥩','🏃','🧘','📖','☀️','🧴','🚭','🥗','🦵','🧊','⏱️'];

function abrirHabito(id){
  const c = ciclo();
  const h = id ? c.habitos.find(x => x.id === id) : null;
  const novo = !h;
  const atual = h || {nome:'', emoji:'⭐', tipo:'check', detalhe:'', meta:1, unidade:'', passo:1, xp:10, ativo:true};

  abrirFolha(novo ? 'Novo hábito' : 'Editar hábito', novo ? 'Ele passa a aparecer todos os dias.' : '', `
    <label class="campo"><span>Nome</span>
      <input type="text" id="h-nome" value="${esc(atual.nome)}" placeholder="Ex.: Proteína"></label>
    <label class="campo"><span>Ícone</span>
      <input type="text" id="h-emoji" value="${esc(atual.emoji)}" maxlength="4" style="width:80px;text-align:center;font-size:1.3rem"></label>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
      ${EMOJIS.map(e => `<button class="btn pequeno" data-emoji="${e}" style="font-size:1.1rem;padding:6px 9px">${e}</button>`).join('')}
    </div>
    <label class="campo"><span>Descrição curta</span>
      <input type="text" id="h-detalhe" value="${esc(atual.detalhe || '')}" placeholder="opcional"></label>
    <label class="campo"><span>Tipo de registro</span>
      <select id="h-tipo" ${atual.tipo === 'sono' ? 'disabled' : ''}>
        <option value="check" ${atual.tipo === 'check' ? 'selected' : ''}>Check simples</option>
        <option value="quantidade" ${atual.tipo === 'quantidade' ? 'selected' : ''}>Quantidade com meta</option>
        ${atual.tipo === 'sono' ? '<option value="sono" selected>Sono (progressivo)</option>' : ''}
      </select></label>
    <div id="bloco-qtd" style="${atual.tipo === 'quantidade' ? '' : 'display:none'}">
      <div class="dupla">
        <label class="campo"><span>Meta</span>
          <input type="number" id="h-meta" step="0.25" value="${atual.meta ?? 1}"></label>
        <label class="campo"><span>Unidade</span>
          <input type="text" id="h-unidade" value="${esc(atual.unidade || '')}" placeholder="L, g, min"></label>
      </div>
      <label class="campo"><span>Passo do botão + / −</span>
        <input type="number" id="h-passo" step="0.25" min="0.05" value="${atual.passo ?? 1}"></label>
    </div>
    <label class="campo"><span>XP por conclusão</span>
      <input type="number" id="h-xp" min="0" value="${atual.xp}"></label>
    <div class="interruptor" style="margin-top:6px">
      <span style="font-weight:600">Ativo neste ciclo</span>
      <div class="chave ${atual.ativo ? 'on' : ''}" id="h-ativo" role="switch" tabindex="0"></div>
    </div>
    <div class="folha-acoes">
      ${novo ? '<button class="btn" data-fechar>Cancelar</button>'
             : '<button class="btn perigo" id="h-excluir">Excluir</button>'}
      <button class="btn volt" id="h-salvar">Salvar</button>
    </div>`, () => {
    const $ = i => document.getElementById(i);
    const tipo = $('h-tipo');
    tipo.addEventListener('change', () => {
      $('bloco-qtd').style.display = tipo.value === 'quantidade' ? '' : 'none';
    });
    document.querySelectorAll('[data-emoji]').forEach(b =>
      b.addEventListener('click', () => { $('h-emoji').value = b.dataset.emoji; }));

    let ativo = atual.ativo;
    const chave = $('h-ativo');
    const alt = () => { ativo = !ativo; chave.classList.toggle('on', ativo); };
    chave.addEventListener('click', alt);
    chave.addEventListener('keydown', e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); alt(); } });

    $('h-salvar').addEventListener('click', () => {
      const nome = $('h-nome').value.trim();
      if(!nome){ avisar('Dê um nome ao hábito.'); return; }
      const registroHabito = {
        id: h ? h.id : 'h-' + Date.now().toString(36),
        nome,
        emoji: $('h-emoji').value.trim() || '⭐',
        detalhe: $('h-detalhe').value.trim(),
        tipo: h && h.tipo === 'sono' ? 'sono' : tipo.value,
        meta: tipo.value === 'quantidade' ? Number($('h-meta').value) || 0 : (h ? h.meta : null),
        unidade: tipo.value === 'quantidade' ? $('h-unidade').value.trim() : '',
        passo: tipo.value === 'quantidade' ? (Number($('h-passo').value) || 1) : undefined,
        xp: Math.max(0, Number($('h-xp').value) || 0),
        ativo
      };
      if(h) Object.assign(h, registroHabito);
      else c.habitos.push(registroHabito);
      salvar(); fecharFolha(); avisar(novo ? 'Hábito criado.' : 'Hábito atualizado.', true);
      RENDERIZADORES.ajustes();
    });

    const excluir = $('h-excluir');
    if(excluir) excluir.addEventListener('click', () => {
      c.habitos = c.habitos.filter(x => x.id !== h.id);
      salvar(); fecharFolha(); avisar('Hábito removido.');
      RENDERIZADORES.ajustes();
    });
  });
}

/* --- Pesagem --- */
function abrirPesagem(){
  const c = ciclo();
  const ultima = dados.pesagens.slice().sort((a,b) => b.data.localeCompare(a.data))[0];
  abrirFolha('Registrar pesagem', 'Mesmo dia, mesmo horário, condições parecidas.', `
    <label class="campo"><span>Data</span><input type="date" id="p-data" value="${hoje()}"></label>
    <div class="dupla">
      <label class="campo"><span>Peso (kg)</span>
        <input type="number" id="p-peso" step="0.1" inputmode="decimal"
          value="${ultima ? ultima.peso : c.pesoReferencia}"></label>
      <label class="campo"><span>Gordura (%)</span>
        <input type="number" id="p-gordura" step="0.1" placeholder="opcional" value="${ultima && ultima.gordura ? ultima.gordura : ''}"></label>
    </div>
    <div class="folha-acoes">
      <button class="btn" data-fechar>Cancelar</button>
      <button class="btn volt" id="p-salvar">Salvar</button>
    </div>
    <p class="sub" style="margin:14px 0 0;text-align:center">A bioimpedância serve para a tendência, não como medida clínica.</p>`, () => {
    document.getElementById('p-salvar').addEventListener('click', () => {
      const data = document.getElementById('p-data').value || hoje();
      const peso = Number(document.getElementById('p-peso').value);
      if(!peso){ avisar('Informe o peso.'); return; }
      const gordura = Number(document.getElementById('p-gordura').value) || null;
      dados.pesagens = dados.pesagens.filter(p => p.data !== data);
      dados.pesagens.push({data, peso, gordura});
      salvar(); fecharFolha(); vibrar(14); avisar('Pesagem registrada.', true);
      RENDERIZADORES.progresso();
    });
  });
}

/* --- Medidas --- */
function abrirMedidas(){
  const c = ciclo();
  if(!c.medidas.length){ avisar('Defina as medidas em Ajustes.'); return; }
  abrirFolha('Registrar medidas', 'Podem ter periodicidade diferente da pesagem.', `
    <label class="campo"><span>Data</span><input type="date" id="m-data" value="${hoje()}"></label>
    ${c.medidas.map((m,i) => `
      <label class="campo"><span>${esc(m)} (cm)</span>
        <input type="number" step="0.5" inputmode="decimal" data-medida="${i}" placeholder="opcional"></label>`).join('')}
    <div class="folha-acoes">
      <button class="btn" data-fechar>Cancelar</button>
      <button class="btn volt" id="m-salvar">Salvar</button>
    </div>`, () => {
    document.getElementById('m-salvar').addEventListener('click', () => {
      const data = document.getElementById('m-data').value || hoje();
      const valores = {};
      document.querySelectorAll('[data-medida]').forEach(i => {
        const v = Number(i.value);
        if(v) valores[c.medidas[Number(i.dataset.medida)]] = v;
      });
      if(!Object.keys(valores).length){ avisar('Preencha ao menos uma medida.'); return; }
      dados.medidas = dados.medidas.filter(m => m.data !== data);
      dados.medidas.push({data, valores});
      salvar(); fecharFolha(); avisar('Medidas registradas.', true);
      RENDERIZADORES.progresso();
    });
  });
}

/* --- Ver e editar um dia do histórico --- */
function abrirDia(data){
  const c = ciclo();
  const r = resumoDia(data, c);
  abrirFolha(dataLonga(data), `${pct(r.percent)} de consistência · ${Math.round(r.xp)} XP`, `
    <div>${r.itens.map(i => `
      <div class="habito ${i.aval.feito >= 1 ? 'feito' : i.aval.feito > 0 ? 'parcial' : ''}">
        <div class="emoji">${i.habito.emoji}</div>
        <div class="info"><b>${esc(i.habito.nome)}</b><span>${esc(i.aval.texto || '')}</span></div>
        ${i.habito.tipo === 'check'
          ? `<button class="marcador ${i.aval.feito ? 'feito' : ''}" data-dia-check="${i.habito.id}">
               <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></button>`
          : `<b style="font-size:.85rem;color:var(--cinza-2)">${i.aval.feito >= 1 ? '✓' : ''}</b>`}
      </div>`).join('')}
    </div>
    ${r.atividade.plano.exige ? `
      <div class="atividade ${r.atividade.marcada ? 'feita' : ''}" style="margin-top:10px">
        <div class="emoji">${r.atividade.plano.emoji}</div>
        <div class="txt"><b>${esc(r.atividade.plano.nome)}</b><span>Atividade programada</span></div>
        <button class="marcador ${r.atividade.marcada ? 'feito' : ''}" id="dia-atividade">
          <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></button>
      </div>` : ''}
    <div class="folha-acoes">
      <button class="btn" data-fechar>Fechar</button>
      <button class="btn volt" id="dia-editar">Ajustar atividade</button>
    </div>
    <p class="sub" style="margin:14px 0 0;text-align:center;line-height:1.5">
      Registrar um dia esquecido é sempre melhor do que deixar em branco.</p>`, () => {
    document.querySelectorAll('[data-dia-check]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.diaCheck;
      const reg = registro(data);
      reg.habitos[id] = !reg.habitos[id];
      salvar(); vibrar(10);
      abrirDia(data);
      RENDERIZADORES[abaAtual]();
    }));
    const at = document.getElementById('dia-atividade');
    if(at) at.addEventListener('click', () => {
      const reg = registro(data);
      const plano = atividadePlanejada(data, c);
      reg.atividade = {feita: !(reg.atividade && reg.atividade.feita), tipo:plano.tipo};
      salvar(); vibrar(12);
      abrirDia(data);
      RENDERIZADORES[abaAtual]();
    });
    document.getElementById('dia-editar').addEventListener('click', () => abrirTrocaAtividade(data));
  });
}

/* =========================================================================
   15. Início
   ========================================================================= */
irPara('hoje');

/* O dia pode virar com o app aberto. */
let diaCorrente = hoje();
setInterval(() => {
  if(hoje() !== diaCorrente){ diaCorrente = hoje(); semanaVista = null; RENDERIZADORES[abaAtual](); }
}, 60000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && hoje() !== diaCorrente){ diaCorrente = hoje(); semanaVista = null; RENDERIZADORES[abaAtual](); }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
